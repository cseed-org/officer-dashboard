name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The default parser only accepts word characters; Dependabot's
          # development prefix also contains a hyphen.
          headerPattern: '^([\w-]+)(?:\((.*)\))?!?: (.*)$'
          types: |
            feat
            fix
            perf
            deps
            deps-dev
            docs
            chore
            ci
            build
            refactor
            revert
            style
            test
