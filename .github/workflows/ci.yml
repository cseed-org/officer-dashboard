name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx astro check
      - name: Development proxy regression test
        run: node --test integrations/astro-config.test.mjs
      - name: Browser-independent unit tests
        run: |
          npm ci --prefix ..
          WEB_ORIGIN=http://127.0.0.1:4340 npx playwright test tests/unit.spec.ts --project=desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - name: go vet (dev build tag)
        run: go vet -tags dev ./...
      - run: go test ./...
      - name: go test (dev build tag, where /auth/dev exists)
        run: go test -tags dev ./internal/api ./cmd/...
      - name: build (release flags)
        run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o /tmp/dashboard ./cmd/dashboard

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - name: MCP tool list matches the contract
        run: node scripts/gen-mcp-tools.mjs --check
      - name: Script regression tests
        run: npm run test:scripts
      - name: Canonical and browser contract parity
        run: node scripts/contract-parity.mjs
      - run: npm run contract-check

  release:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Build and smoke test the embedded release
        run: |
          make -C server build-release VERSION="${GITHUB_SHA::7}"
          node scripts/release-smoke.mjs --bin server/bin/dashboard

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the documented development stack
        run: docker compose -p ci-e2e -f compose.dev.yaml up -d --build --wait
      - name: Discover the full suite with stock e2e mounts
        run: docker compose -p ci-e2e -f compose.dev.yaml run --rm --no-deps e2e npx playwright test --list
      - name: Exercise shared-contract imports
        run: docker compose -p ci-e2e -f compose.dev.yaml run --rm --no-deps e2e npx playwright test tests/unit.spec.ts --project=desktop
      - name: Exercise integrations against the built site
        run: docker compose -p ci-e2e -f compose.dev.yaml run --rm --no-deps -e WEB_ORIGIN=http://dashboard:8090 e2e npx playwright test tests/home-speed.spec.ts --project=desktop
      - name: Logs on failure
        if: failure()
        run: docker compose -p ci-e2e -f compose.dev.yaml logs --tail 100
      - name: Clean up
        if: always()
        run: docker compose -p ci-e2e -f compose.dev.yaml down -v

  # The release image (server/Dockerfile) for both platforms. Pull requests only build it; the
  # publish job below pushes it, only from main, once every check has passed.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64 (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  publish:
    # Tag revisions never authorize publication. Production promotion is a separate,
    # main-controlled workflow behind the protected production environment (PR #104).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, go, contract, release, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cseed-org/officer-dashboard
      # Put the OCI annotations (source, revision, version…) on the multi-platform index too,
      # where GHCR reads them, not only on each platform's manifest.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version stamped into the binary (dashboard version)
        id: version
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # CI publishes main and sha-<7-character commit>; PR #104 promotes a checked SHA to prod.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=officer-dashboard
            org.opencontainers.image.description=CSEED officer dashboard: Go server with the embedded web front end and Litestream
          annotations: |
            org.opencontainers.image.title=officer-dashboard
            org.opencontainers.image.description=CSEED officer dashboard: Go server with the embedded web front end and Litestream
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Registry publication never imports or exports the PR build cache.
          no-cache: true
