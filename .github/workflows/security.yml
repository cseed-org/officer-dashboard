name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 8 * * 1'

permissions:
  contents: read

jobs:
  litestream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the shipped image
        run: |
          npm ci --prefix web
          npm run build --prefix web
          docker build -f server/Dockerfile -t dashboard-security .
      - name: Smoke test Litestream in the release image
        run: |
          docker image inspect dashboard-security --format '{{.Size}}'
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/scripts/litestream-smoke.sh:/litestream-smoke.sh:ro" \
            dashboard-security /litestream-smoke.sh
      - name: Scan the shipped Litestream binary
        run: |
          container=$(docker create dashboard-security)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/local/bin/litestream" ./litestream
          go version ./litestream
          expected=$(sed -n 's/^toolchain //p' server/go.mod)
          test "$(go version ./litestream)" = "./litestream: $expected"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode=binary ./litestream

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Scan the same toolchain used by CI and release builds.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan production packages
        run: govulncheck ./...

  # Known vulnerabilities in the npm packages that ship (dependencies, not dev tooling): the
  # web build's runtime (astro, preact, zod) and the root contract package.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [web, .]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
