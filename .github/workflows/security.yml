name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 8 * * 1'

permissions:
  contents: read

jobs:
  # PR/main scans run inside CI so publication depends on their result.
  gitleaks-scheduled:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gitleaks.yml

  backup-sink:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: server/deploy/backup-sink
      - run: npm audit --audit-level=high
        working-directory: server/deploy/backup-sink
      - run: npm test
        working-directory: server/deploy/backup-sink
      - name: Build and exercise the encrypted backup client
        run: |
          docker build -f server/Dockerfile -t dashboard-backup-qa .
          docker build -f server/Dockerfile --target backup-test-image -t dashboard-backup-test .
          node scripts/backup-roundtrip.mjs
      - name: Write host files through scripts/setup with real owners (root)
        run: |
          # The launcher runs only pinned images. Use the built image's digest reference,
          # or push it to a throwaway local registry when the image store records none.
          image="$(docker image inspect dashboard-backup-qa --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          if [ -z "$image" ]; then
            docker run -d --rm --name setup-registry -p 127.0.0.1:5000:5000 registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
            docker tag dashboard-backup-qa localhost:5000/dashboard-setup-qa:e2e
            docker push -q localhost:5000/dashboard-setup-qa:e2e
            image="$(docker image inspect localhost:5000/dashboard-setup-qa:e2e --format '{{index .RepoDigests 0}}')"
          fi
          sudo python3 scripts/setup_e2e.py --image "$image"
          # The hostfiles package's own real-chown test, as root, in the Dockerfile's Go image.
          docker run --rm -e HOSTFILES_REQUIRE_ROOT=1 -v "$PWD/server:/src" -w /src \
            golang:1.27.4-bookworm@sha256:ce59b41415e2524ae99926fe1f37ce48ba8c194dcbd2a56a65436cdcefa2bd34 \
            go test -run 'TestRealOwnershipAsRoot|TestCompleteInstallIsANoOp' -v ./internal/setup/hostfiles/

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Scan the same toolchain used by CI and release builds.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan production packages
        run: govulncheck ./...

  # Known vulnerabilities in the npm packages that ship (dependencies, not dev tooling): the
  # web build's runtime (astro, preact, zod) and the root contract package.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [web, .]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
