name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 8 * * 1'

permissions:
  contents: read

jobs:
  # PR/main scans run inside CI so publication depends on their result.
  gitleaks-scheduled:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gitleaks.yml

  backup-sink:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: server/deploy/backup-sink
      - run: npm audit --audit-level=high
        working-directory: server/deploy/backup-sink
      - run: npm test
        working-directory: server/deploy/backup-sink
      - name: Build and exercise the encrypted backup client
        run: |
          docker build -f server/Dockerfile -t dashboard-backup-qa .
          docker build -f server/Dockerfile --target backup-test-image -t dashboard-backup-test .
          node scripts/backup-roundtrip.mjs
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Scan the same toolchain used by CI and release builds.
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan production packages
        run: govulncheck ./...

  # Known vulnerabilities in the npm packages that ship (dependencies, not dev tooling): the
  # web build's runtime (astro, preact, zod) and the root contract package.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [web, .]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
