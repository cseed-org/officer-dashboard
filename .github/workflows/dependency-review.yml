name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=$(curl --silent --show-error --output /tmp/dependency-diff.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          case "$status" in
            200) echo 'available=true' >> "$GITHUB_OUTPUT" ;;
            403|404)
              echo '::warning::Dependency review unavailable. Enable Dependency graph in repository settings.'
              echo 'Dependency review did not run: enable Dependency graph in repository settings. It will run automatically when available.' >> "$GITHUB_STEP_SUMMARY"
              echo 'available=false' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Dependency graph API returned HTTP $status"; exit 1 ;;
          esac
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.graph.outputs.available == 'true'
        with:
          fail-on-severity: high
