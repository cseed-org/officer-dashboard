name: Release please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Require the release GitHub App
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY for a repository-installed GitHub App with contents and pull requests write permissions and v* tag-creation bypass. See scripts/setup-release-app.mjs.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # release-please 17 requires Node 22; ubuntu-latest defaults to Node 20.
          node-version: '22'
      - name: Skip release pull requests without a release-worthy commit
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          # Only feat, fix, perf and deps may cut a release (any scope,
          # optional "!"). Hidden types must not propose one, even through a
          # breaking marker or BREAKING CHANGE note, because release-please
          # keeps breaking notes for hidden types; without this gate a lone
          # "ci!: ..." would open a release PR.
          last=$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          range=HEAD
          if [[ -n "$last" ]]; then range="$last..HEAD"; fi
          eligible=$(git log --format=%s "$range" | node scripts/release-gate.mjs)
          if [[ "$eligible" == true ]]; then
            echo "Commits since ${last:-the first commit} include a release-worthy type."
          else
            echo "No feat/fix/perf/deps commit since ${last:-the first commit}; no release PR."
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - name: Create or update the release pull request
        if: steps.gate.outputs.eligible == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          npx --yes release-please@17.11.2 release-pr
          --token "$RELEASE_PLEASE_TOKEN"
          --repo-url "$REPO"
          --config-file release-please-config.json
          --manifest-file .release-please-manifest.json
      - name: Publish releases for merged release pull requests
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          npx --yes release-please@17.11.2 github-release
          --token "$RELEASE_PLEASE_TOKEN"
          --repo-url "$REPO"
          --config-file release-please-config.json
          --manifest-file .release-please-manifest.json
