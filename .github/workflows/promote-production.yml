name: Approve production image
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA whose CI publish succeeded
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
      packages: write
    env:
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/cseed-org/officer-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require main ancestry and a successful CI publish
        run: |
          # A missing/unprotected Environment can otherwise start without human approval.
          # Require a required_reviewers rule with at least one reviewer and
          # deployments restricted to protected branches (or main only).
          # Self-review is allowed because the repository has a sole maintainer
          # who both dispatches and approves the promotion (decision D-15).
          # To tighten later, add a second reviewer, enable "Prevent self-review"
          # on the environment, and require .prevent_self_review == true here.
          env_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/production")
          jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)' <<<"$env_json" >/dev/null
          if ! jq -e '.deployment_branch_policy.protected_branches == true' <<<"$env_json" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" \
              --jq '[.branch_policies[].name] | any(. == "main")' | grep -qx true
          fi
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$COMMIT" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&status=success" \
            --jq '.workflow_runs | any(.head_branch == "main" and .conclusion == "success")' | grep -qx true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the approved immutable source as prod
        run: |
          source="$IMAGE:sha-${COMMIT:0:7}"
          digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest)
          revision=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Manifest}}' | jq -r '.annotations["org.opencontainers.image.revision"]')
          test "$revision" = "$COMMIT"
          docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE@$digest"
