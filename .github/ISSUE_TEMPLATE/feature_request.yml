name: Feature request
description: Suggest an improvement to the dashboard.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and who it affects
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
    validations:
      required: false
