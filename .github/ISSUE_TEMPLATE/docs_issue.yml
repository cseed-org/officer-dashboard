name: Documentation issue
description: Report missing, unclear or incorrect documentation.
labels: [documentation]
body:
  - type: textarea
    id: page
    attributes:
      label: Documentation page or file
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
    validations:
      required: false
