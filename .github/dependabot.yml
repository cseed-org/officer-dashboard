version: 2
updates:
  - package-ecosystem: docker
    directory: /server
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /server
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
