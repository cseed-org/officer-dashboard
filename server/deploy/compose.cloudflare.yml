# Production: immutable approved digest, separate app/backup secret mounts.
# See docs/deploy/fresh-install.md. Every compose invocation uses both env files:
# docker compose --env-file .env --env-file prod-image.env -f compose.cloudflare.yml up -d
name: ${COMPOSE_PROJECT_NAME:-officer-dashboard}

x-dashboard-runtime: &dashboard-runtime
  image: ${DASHBOARD_IMAGE:?set DASHBOARD_IMAGE to an approved image@sha256:digest}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  mem_limit: 512m
  pids_limit: 128
  stop_grace_period: 45s

services:
  dashboard:
    <<: *dashboard-runtime
    env_file: dashboard.env
    environment:
      APP_URL: ${APP_URL:?set the public HTTPS origin}
      ADDR: ":8090"
      TRUSTED_PROXIES: ${TUNNEL_NET:-10.250.89}.8/29
      BACKUP_REQUIRED: "1"
      DEPLOY_IMAGE: ${DASHBOARD_IMAGE}
    networks: [tunnel]
    volumes:
      - dashboard-data:/data
      - type: bind
        source: ./secrets/app
        target: /run/secrets/app
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "/app/dashboard", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  backup:
    <<: *dashboard-runtime
    entrypoint: ["/app/dashboard-backup"]
    command: ["loop"]
    env_file: backup.env
    environment:
      DB_PATH: /data/dashboard.db
      DEPLOY_IMAGE: ${DASHBOARD_IMAGE}
    mem_limit: 256m
    pids_limit: 64
    networks: [backup-egress]
    volumes:
      - dashboard-data:/data
      - type: bind
        source: ./secrets/backup
        target: /run/secrets/backup
        read_only: true
        bind: {create_host_path: false}
    healthcheck: {disable: true}

  cloudflared:
    # Official image. Pin a release and bump it deliberately
    # (https://github.com/cloudflare/cloudflared/releases).
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    mem_limit: 128m
    pids_limit: 64
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    volumes:
      - type: bind
        source: ${TUNNEL_TOKEN_FILE:?set the host path to the tunnel token file}
        target: /run/secrets/tunnel-token
        read_only: true
        bind: {create_host_path: false}
    networks: [tunnel]
    depends_on:
      dashboard: {condition: service_healthy}

networks:
  backup-egress: {}
  tunnel:
    driver: bridge
    ipam:
      config:
        # All three read TUNNEL_NET (the first three octets), like TRUSTED_PROXIES above. Set
        # it to another private /24 prefix if this one is used on your LAN or by another
        # Docker network. The gateway sits outside ip_range, so it is never trusted.
        - subnet: ${TUNNEL_NET:-10.250.89}.0/28
          ip_range: ${TUNNEL_NET:-10.250.89}.8/29
          gateway: ${TUNNEL_NET:-10.250.89}.1

volumes:
  dashboard-data:
