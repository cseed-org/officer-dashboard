name = "dashboard-backup-sink"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# D-13: custom domain behind Access service-token authentication plus the bearer.
# Bearer authentication is enforced independently. No membership binding/token.
[[d1_databases]]
binding = "BACKUPS"
database_name = "dashboard-backups"
database_id = "REPLACE_WITH_BACKUP_DATABASE_ID"
migrations_dir = "migrations"
