<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home V0.7 widgets · CSEED design</title>
<!--
  Home V0.7 widget redesign: design mockup only (branch v07-home-widgets). Self-contained: inline CSS,
  inline SVG, no external assets. Notes for the implementer: home-v07-notes.md beside this file.

  Token values below are COPIED from src/styles/tokens.css, src/styles/v03.css and
  src/styles/home-grid.css so this file stands alone. They are scoped to .theme[data-theme] (instead
  of :root) only so both themes can render on one page. Production keeps them on :root.
  New tokens (the only two): --home-stagger and --dur-chart, marked NEW below.
-->
<style>
/* ═════════════ Tokens (copied; see header) ═════════════ */
.theme[data-theme="light"] {
  color-scheme: light;
  --bg:#ffffff; --surface:#ffffff; --sunken:#f7f7f5; --text:#202320; --muted:#646963; --line:#e3e5e1;
  --control:#858b82; --accent:#202320; --accent-ink:#ffffff; --positive:#326247; --negative:#a33732;
  --attention:#805b20; --info:#485f73; --hover:#eeefec;
  --c-blue:#2f6fc4; --c-amber:#b47c0c; --c-teal:#0a948a; --c-coral:#d9634a; --c-violet:#7a5bd0; --c-green:#3d8f3f;
  --tint:11%;
  --block-shadow:0 1px 2px rgb(20 20 20 / .04), 0 1px 1px rgb(20 20 20 / .03);
  --block-drop:color-mix(in srgb, var(--c-blue) 12%, var(--surface));
  --overlay-shadow:0 18px 40px -18px rgb(0 0 0 / .22), 0 2px 6px rgb(0 0 0 / .06);
}
.theme[data-theme="dark"] {
  color-scheme: dark;
  --bg:#181a18; --surface:#1c1f1c; --sunken:#212421; --text:#eeefeb; --muted:#a8aea5; --line:#373d36;
  --control:#778271; --accent:#eeefeb; --accent-ink:#181a18; --positive:#94c6a5; --negative:#f0a09a;
  --attention:#dbc38e; --info:#a8bfd2; --hover:#2b302a;
  --c-blue:#4f8ad8; --c-amber:#b98428; --c-teal:#1f9d92; --c-coral:#d96d52; --c-violet:#8f78e0; --c-green:#4fa156;
  --tint:18%;
  --block-shadow:0 1px 2px rgb(0 0 0 / .4);
  --block-drop:color-mix(in srgb, var(--c-blue) 22%, var(--surface));
  --overlay-shadow:0 18px 40px -16px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .3);
}
.theme {
  --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --font-display: 'Playfair Display', ui-serif, Georgia, 'Times New Roman', serif;
  --radius-control:8px; --radius-card:12px; --radius-widget:16px;
  --ease-out:cubic-bezier(.2, .8, .2, 1); --ease-in:cubic-bezier(.4, 0, 1, 1); --ease-soft:cubic-bezier(.22, .61, .36, 1);
  --dur-1:120ms; --dur-2:180ms; --dur-3:240ms; --dur-step:420ms; --motion-distance:8px;
  --home-stagger:40ms;   /* NEW (home-grid.css): entrance stagger between tiles */
  --dur-chart:480ms;     /* NEW (home-grid.css): chart draw / bar grow / donut sweep / count-up */
  --block-row:152px; --block-gap:16px; --block-radius:var(--radius-widget);
  --block-lift:0 18px 40px -18px rgb(0 0 0 / .32), 0 2px 6px rgb(0 0 0 / .08);
  --block-ring:color-mix(in srgb, var(--c-blue) 30%, transparent);
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45;
}
[data-hue="blue"]{--hue:var(--c-blue)} [data-hue="amber"]{--hue:var(--c-amber)} [data-hue="teal"]{--hue:var(--c-teal)}
[data-hue="coral"]{--hue:var(--c-coral)} [data-hue="violet"]{--hue:var(--c-violet)} [data-hue="green"]{--hue:var(--c-green)}

/* ═════════════ Mockup frame (not product) ═════════════ */
* {box-sizing: border-box;}
html, body {margin: 0;}
body {background: #f2f2ef; font-family: ui-sans-serif, system-ui, sans-serif;}
.mk-bar {position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #202320; color: #eeefeb; font-size: 13px;}
.mk-bar b {font-weight: 600; margin-right: 8px;}
.mk-bar a {color: #eeefeb;}
.mk-seg {display: inline-flex; border: 1px solid #555b54; border-radius: 8px; overflow: hidden;}
.mk-seg button, .mk-btn {font: inherit; font-size: 12px; padding: 5px 10px; border: 0; background: transparent; color: #eeefeb; cursor: pointer;}
.mk-seg button[aria-pressed="true"] {background: #eeefeb; color: #202320;}
.mk-btn {border: 1px solid #555b54; border-radius: 8px;}
.mk-btn:hover {background: #373d36;}
.mk-btn--hot {background: #f5d140; color: #202320; border-color: #f5d140; font-weight: 600;}
.mk-btn--hot:hover {background: #ffe27a;}
.mk-only {font-size: 11px; opacity: .7;}
.mk-jump {display: flex; flex-wrap: wrap; gap: 4px 12px; margin-left: auto;}
.theme {padding: 32px 0 56px;}
.theme + .theme {border-top: 4px solid #202320;}
.mk-wrap {max-width: 1180px; margin: 0 auto; padding: 0 32px;}
.mk-theme-tag {display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px;}
.mk-h1 {font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: -.02em; margin: 0 0 4px;}
.mk-h2 {font-size: 18px; font-weight: 600; margin: 48px 0 4px;}
.mk-h3 {font-size: 13px; font-weight: 600; margin: 24px 0 8px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;}
.mk-h3 code, .mk-p code {font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px;}
.mk-p {margin: 0 0 12px; color: var(--muted); font-size: 13px; max-width: 80ch;}
.mk-p strong {color: var(--text); font-weight: 600;}
.mk-legend {display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 8px 0 0;}
.mk-legend span {display: inline-flex; gap: 6px; align-items: center;}
.mk-row {display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0 12px;}
.mk-row .mk-btn {color: var(--text); border-color: var(--line); background: var(--surface);}
.mk-row .mk-btn:hover {background: var(--hover);}
.mk-frame {position: relative;}
.mk-tag {position: absolute; z-index: 30; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #f5d140; color: #202320; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgb(0 0 0 / .15);}
@media (max-width: 767px) {.mk-wrap {padding: 0 16px;} .mk-jump {display: none;} .mk-h1 {font-size: 26px;}}

/* ═════════════ Grid (home-grid.css, unchanged rules) ═════════════ */
.blocks-wrap {container: blocks / inline-size; min-width: 0;}
.blocks {--cols: 4; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(var(--block-row), auto); grid-auto-flow: row dense; gap: var(--block-gap); list-style: none; margin: 0; padding: 0;}
.blk {--w: 1; --h: 1; position: relative; grid-column: span var(--w); grid-row: span var(--h); display: flex; min-width: 0; border-radius: var(--block-radius);}
.blk[data-w="2"] {--w: 2;} .blk[data-w="4"] {--w: 4;} .blk[data-h="2"] {--h: 2;}
@container blocks (max-width: 599px) {
  .blocks {--cols: 2; --block-row: 136px; gap: 12px;}
  .blk[data-w="4"], .blk[data-h="2"] {--w: 2;}
}
/* Edit/push-down demo: explicit placement, as placePushDown() produces. */
.blocks--placed .blk {grid-column: calc(var(--x) + 1) / span var(--w); grid-row: calc(var(--y) + 1) / span var(--h);}

/* ═════════════ Widget card (NEW: shell/widget.css) ═════════════ */
.wc {
  position: relative; flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--block-radius);
  box-shadow: var(--block-shadow); overflow: hidden;
  transition: transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
.wc-head {display: flex; align-items: center; gap: 8px; min-width: 0; height: 24px; flex: none;}
.wc-chip {flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; color: var(--hue); background: color-mix(in srgb, var(--hue) var(--tint), var(--surface));}
.wc-title {min-width: 0; margin: 0; font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.wc-link {color: inherit; text-decoration: none;}
.wc-link::after {content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit;}  /* whole card is the link */
.wc-link:focus-visible {outline: none;}
.wc:has(.wc-link:focus-visible) {outline: 2px solid var(--c-blue); outline-offset: 2px;}
.wc-aside {margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;}
.wc-go {flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; color: var(--muted); opacity: 0; transform: translate(-3px, 3px); transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-2) var(--ease-out);}
.wc-body {position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px;}
.wc-foot {flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: auto;}
/* Anything interactive inside the card sits above the card link. */
.wc a:not(.wc-link), .wc button {position: relative; z-index: 1;}
/* Hover cue: lift, shadow, ↗ by the title. `.is-hover` forces it for the mockup. */
@media (hover: hover) {.wc:hover {transform: translateY(-2px); box-shadow: var(--overlay-shadow); border-color: color-mix(in srgb, var(--control) 40%, var(--line));} .wc:hover .wc-go {opacity: 1; transform: none;}}
.wc.is-hover {transform: translateY(-2px); box-shadow: var(--overlay-shadow); border-color: color-mix(in srgb, var(--control) 40%, var(--line));}
.wc.is-hover .wc-go, .wc:has(.wc-link:focus-visible) .wc-go {opacity: 1; transform: none;}
.wc--nolink .wc-go {display: none;}

/* Compact rows (replace tables): title line + muted meta line, no headers. */
.rows {display: grid; gap: 2px; list-style: none; margin: 0 -8px; padding: 0; align-content: start;}
.rows--2 {grid-template-columns: 1fr 1fr; column-gap: 16px; margin: 0 -8px;}
.row {display: flex; align-items: center; gap: 10px; min-width: 0; padding: 5px 8px; border-radius: 8px; color: inherit; text-decoration: none;}
a.row:hover, a.row.is-hover {background: var(--hover);}
.row-main {flex: 1; min-width: 0; display: grid;}
.row-title {font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.row-meta {font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums;}
.row-side {flex: none; display: grid; justify-items: end; gap: 1px; text-align: right;}
.row-amt {font-size: 13px; line-height: 18px; font-weight: 500; font-variant-numeric: tabular-nums;}
.row-more {font-size: 12px; color: var(--muted); padding: 0 0 0 0; margin-top: auto;}
.sep {padding: 0 4px; opacity: .6;}
/* Status chip: the existing .badge look (dot + written label, never colour alone). */
.st {display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); white-space: nowrap;}
.st::before {content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hue, var(--control));}
.row-meta .st {color: var(--muted);}
.dot {flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--hue, var(--control));}
.avatar {flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 10px; font-weight: 700; color: var(--hue); background: color-mix(in srgb, var(--hue) var(--tint), var(--surface));}
.day-label {font-size: 11px; font-weight: 600; color: var(--muted); margin: 2px 0 2px; text-transform: none;}

/* Stat tiles */
.stat-row {display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; min-width: 0;}
.stat-value {font-size: 2rem; font-weight: 500; letter-spacing: -.04em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap;}
.stat-value--neg {color: var(--negative);}
.stat-sub {font-size: 12px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
.stat-split {flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; min-height: 0; align-items: end;}
.stat-split > div {display: grid; gap: 4px; min-width: 0; align-content: end;}
.mini {display: grid; gap: 3px; font-size: 12px; min-width: 0;}
.mini > span {display: flex; gap: 6px; min-width: 0; white-space: nowrap;}
.mini b {font-weight: 500; overflow: hidden; text-overflow: ellipsis;}
.mini i {font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 3.2em;}

/* Sparkline: the current kit.tsx visual (2px line, end dot), plus a draw-in. */
.sparkline {display: block; overflow: visible; flex: none;}
.sparkline-line {fill: none; stroke: var(--hue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}
.sparkline-dot {fill: var(--hue); stroke: var(--surface); stroke-width: 2;}
.sparkline--wide {width: 100%; height: 44px;}
/* Progress (kit.tsx Progress) */
.progress {display: block; width: 100%; min-width: 48px; height: 6px; border-radius: 999px; overflow: hidden; background: var(--hover);}
.progress-fill {display: block; height: 100%; border-radius: inherit; background: var(--hue); transform-origin: 0 50%;}
.split-legend {display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted);}
.split-legend span {display: inline-flex; gap: 6px; align-items: center;}
/* Column bars (Workers/D1, signups). Axis-less, as today. */
.bars {display: flex; align-items: flex-end; gap: 3px; height: 56px; flex: none;}
.bars i {flex: 1; min-width: 3px; border-radius: 3px 3px 1px 1px; background: var(--hue); opacity: .85; transform-origin: 50% 100%;}
.bars i:last-child {opacity: 1;}
/* Metrics (Cloudflare M/L) */
.metrics {display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px;}
.metrics--4 {grid-template-columns: repeat(4, minmax(0, 1fr));}
.metric {display: grid; gap: 1px; min-width: 0;}
.metric-label {font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.metric-value {font-size: 20px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap;}
.breakdowns {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; min-height: 0;}
.breakdowns h4 {margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted);}
.kv {display: grid; gap: 0; list-style: none; margin: 0; padding: 0; font-size: 12px;}
.kv li {display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; min-width: 0;}
.kv li span:first-child {overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.kv li span:last-child {color: var(--muted); font-variant-numeric: tabular-nums;}
.vital {display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px;}
.vital:first-child {border-top: 0;}
.vital b {font-weight: 500; flex: 1;}
.vital span {font-variant-numeric: tabular-nums;}
.vital small {font-size: 11px; color: var(--muted); min-width: 64px; text-align: right;}

/* Budget donut + legend */
.donut-wrap {flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; min-height: 0;}
.donut {position: relative; display: grid; place-items: center;}
.donut svg {display: block; transform: rotate(-90deg);}
.donut-track {fill: none; stroke: var(--hover);}
.donut-seg {fill: none; stroke: var(--hue);}
.donut-center {position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15;}
.donut-center b {font-size: 22px; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums;}
.donut-center > span {font-size: 11px; color: var(--muted);}
.legend {display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; min-width: 0; font-size: 12px;}
.legend--2 {grid-template-columns: 1fr 1fr; column-gap: 20px; row-gap: 10px;}
.legend li {display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; min-width: 0;}
.legend li > b {font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.legend li > span {color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;}
.legend li .progress {grid-column: 2 / -1; height: 4px;}
.legend-total {display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding-top: 8px; border-top: 1px solid var(--line);}
.legend-total b {color: var(--text); font-weight: 500;}
.over {color: var(--negative);}

/* Links */
.links {display: grid; gap: 2px; list-style: none; margin: 0 -8px; padding: 0;}
.links--row {grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0;}
.links--grid {grid-template-columns: 1fr 1fr; gap: 8px; margin: 0;}
.link-row {display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 8px; border-radius: 8px; color: inherit; text-decoration: none;}
a.link-row:hover {background: var(--hover);}
.links--row .link-row, .links--grid .link-row {flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; background: var(--sunken); border-radius: 10px;}
.links--grid .link-row {min-height: 92px; justify-content: space-between;}
.link-chip {flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font-weight: 600; font-size: 12px;}
.link-unset {color: var(--muted);}
.link-unset .link-chip {color: var(--muted);}

/* Calendar: week (2×1, 2×2) and month (4×2). No buttons, menus or chips-as-controls. */
.cal {flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; min-height: 0;}
.cal-day {min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 4px; border-radius: 8px; background: var(--sunken);}
.cal-day.is-weekend {background: color-mix(in srgb, var(--sunken) 50%, var(--surface)); }
.cal-day.is-today {background: color-mix(in srgb, var(--c-blue) calc(var(--tint) * .7), var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-blue) 35%, transparent);}
.cal-dh {display: flex; align-items: baseline; gap: 4px; padding: 0 2px 2px; font-size: 11px; color: var(--muted); white-space: nowrap;}
.cal-dh b {font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums;}
.cal-day.is-today .cal-dh b {display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px;}
.cal-more {margin-left: auto; font-size: 10px; color: var(--muted);}
.cal-chip {display: block; min-width: 0; padding: 2px 5px; border-radius: 5px; border-left: 2px solid var(--hue); background: color-mix(in srgb, var(--hue) var(--tint), var(--surface)); color: var(--text); text-decoration: none; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.cal-chip time {font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 4px; font-size: 10px;}
a.cal-chip:hover {background: color-mix(in srgb, var(--hue) calc(var(--tint) * 2), var(--surface));}
.cal-chip--2 {display: grid; padding: 2px 5px;}
.cal-chip--2 time {margin: 0; line-height: 12px;}
.cal--tall .cal-chip {white-space: normal; display: grid; padding: 3px 5px;}
.cal--tall .cal-chip time {margin: 0;}
.cal--tall .cal-chip span {display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
.cal-empty-line {position: absolute; inset: auto 0 6px; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none;}
.calm {flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(0, 1fr)); gap: 3px; min-height: 0;}
.calm-dow {font-size: 11px; color: var(--muted); padding: 0 4px;}
.calm-day {min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 3px 4px; border-radius: 6px; background: var(--sunken);}
.calm-day.is-weekend {background: color-mix(in srgb, var(--sunken) 50%, var(--surface));}
.calm-day.is-outside {opacity: .45;}
.calm-day.is-today {background: color-mix(in srgb, var(--c-blue) calc(var(--tint) * .7), var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-blue) 35%, transparent);}
.calm-dh {display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 16px; font-variant-numeric: tabular-nums;}
.calm-day.is-today .calm-dh b {display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600;}
.calm-dh b {font-weight: 500;}
.calm .cal-chip {font-size: 10px; line-height: 13px; padding: 1px 4px;}

/* Empty state: muted widget icon + one line. */
.empty {flex: 1; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; color: var(--muted); font-size: 13px; padding: 4px 8px;}
.empty svg {color: var(--control); opacity: .8;}
.empty--row {grid-auto-flow: column; gap: 10px; align-items: center;}

/* ═════════════ Edit mode ═════════════ */
.blocks.is-editing .blk {cursor: grab;}                 /* the whole tile is the drag target */
.blocks.is-editing .wc {box-shadow: 0 0 0 2px var(--block-ring), var(--block-shadow); transform: none;}
.blocks.is-editing .wc-body, .blocks.is-editing .wc-foot {opacity: .55; pointer-events: none; user-select: none;}
.blocks.is-editing .wc-go, .blocks.is-editing .wc-aside {display: none;}
.blocks.is-editing .wc-link {pointer-events: none;}
.blocks.is-editing .blk:hover .wc, .blocks.is-editing .blk.is-hover .wc {box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-blue) 55%, transparent), var(--block-shadow);}
.blocks.is-sway .blk:not(.is-placeholder):not(.is-resizing) .wc {animation: blk-sway 3.2s var(--ease-soft) infinite alternate; animation-delay: calc(var(--i, 0) * -430ms);}
@keyframes blk-sway {from {transform: rotate(-.3deg);} to {transform: rotate(.3deg);}}
.blk-remove {position: absolute; z-index: 3; top: 12px; right: 12px; width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--text); color: var(--bg); cursor: pointer; padding: 0;}
/* Resize: right edge, bottom edge, corner. Hit strips 12px; visible grips brighten on tile hover. */
.rz {position: absolute; z-index: 3; display: grid; place-items: center; touch-action: none;}
.rz-e {top: 40px; bottom: 24px; right: -6px; width: 12px; cursor: ew-resize;}
.rz-s {left: 24px; right: 40px; bottom: -6px; height: 12px; cursor: ns-resize;}
.rz-se {right: -4px; bottom: -4px; width: 28px; height: 28px; cursor: nwse-resize;}
.rz-e::before, .rz-s::before {content: ""; border-radius: 999px; background: var(--control); opacity: .45; transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);}
.rz-e::before {width: 4px; height: 28px;}
.rz-s::before {width: 28px; height: 4px;}
.rz-se svg {color: var(--control); opacity: .55; transition: opacity var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);}
.blk:hover .rz::before, .blk.is-hover .rz::before, .blk.is-resizing .rz::before {opacity: 1; background: var(--c-blue);}
.blk:hover .rz-se svg, .blk.is-hover .rz-se svg, .blk.is-resizing .rz-se svg {opacity: 1; color: var(--c-blue);}
@media (pointer: coarse) {.rz::before, .rz-se svg {opacity: 1;}}
/* Dragging: the origin cell is the drop target; a static clone follows the pointer. */
.blk.is-placeholder {background: var(--block-drop); box-shadow: inset 0 0 0 2px var(--block-ring); cursor: grabbing;}
.blk.is-placeholder > * {visibility: hidden;}
.blk-float {position: absolute; z-index: 20; display: flex; pointer-events: none; transform: rotate(-1.2deg) scale(1.02); cursor: grabbing;}
.blk-float .wc {box-shadow: var(--block-lift), 0 0 0 2px var(--block-ring);}
.blk-float .wc-body, .blk-float .wc-foot {opacity: 1;}
/* Resizing: the tile shows its preview size; neighbours slide (FLIP, --dur-3). */
.blk.is-resizing .wc {outline: 2px solid var(--c-blue); outline-offset: 3px; box-shadow: var(--block-shadow);}
.blk-size {position: absolute; z-index: 4; left: 12px; bottom: 12px; padding: 3px 8px; border-radius: 8px; background: var(--surface); border: 1px solid var(--block-ring); box-shadow: var(--block-shadow); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;}
.blk.is-pushed .wc {box-shadow: 0 0 0 2px var(--block-ring), var(--block-shadow);}
.push-tag {position: absolute; z-index: 5; top: 13px; right: 44px; font-size: 11px; font-weight: 600; color: var(--c-blue); background: var(--surface); border: 1px solid var(--block-ring); border-radius: 999px; padding: 1px 8px;}

/* ═════════════ Load motion (NEW: shell/entrance.ts adds .is-entering once per session) ═════════════ */
@media (prefers-reduced-motion: no-preference) {
  .is-entering .blk {animation: wc-in var(--dur-step) var(--ease-soft) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger));}
  .is-entering .sparkline-line {stroke-dasharray: 1; animation: draw var(--dur-chart) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger) + 40ms);}
  .is-entering .sparkline-dot {animation: fade var(--dur-2) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger) + 40ms + var(--dur-chart) - 80ms);}
  .is-entering .progress-fill {animation: grow-x var(--dur-chart) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger) + 40ms);}
  .is-entering .bars i {animation: grow-y var(--dur-chart) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger) + 40ms + var(--b, 0) * 8ms);}
  .is-entering .donut-sweep {animation: sweep var(--dur-chart) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger) + 40ms);}
  .is-entering .cal-chip {animation: fade var(--dur-3) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * var(--home-stagger) + 80ms + min(var(--c, 0), 10) * 12ms);}
}
@keyframes wc-in {from {opacity: 0; transform: translateY(var(--motion-distance));} to {opacity: 1; transform: none;}}
@keyframes draw {from {stroke-dashoffset: 1;} to {stroke-dashoffset: 0;}}
@keyframes grow-x {from {transform: scaleX(0);} to {transform: scaleX(1);}}
@keyframes grow-y {from {transform: scaleY(0);} to {transform: scaleY(1);}}
@keyframes sweep {from {stroke-dashoffset: 100;} to {stroke-dashoffset: 0;}}
@keyframes fade {from {opacity: 0;} to {opacity: 1;}}
@media (prefers-reduced-motion: reduce) {.wc, .wc-go, .rz::before, .rz-se svg {transition: none;} .blocks.is-sway .blk .wc {animation: none !important;}}

/* Phone (Home under 600px): two columns; dense rules as home-grid.css. */
@container blocks (max-width: 599px) {

  .calm-day .cal-dot {display: inline-block;}
}
.cal-dot {display: none; width: 5px; height: 5px; border-radius: 50%; background: var(--hue);}

    card('kpi-pending', '1x1'),
  ].join(''));

  out += sec('edit', 'Edit mode', 'After <strong>Edit home</strong>, the whole tile is the drag handle (<code>cursor: grab</code>, native). Headers stay readable, the body dims to 55% and turns inert, and ↗ and the aside hide. There’s a remove button top-right, and resize grips on the right edge, the bottom edge and the corner (<code>ew-resize</code>, <code>ns-resize</code>, <code>nwse-resize</code>). The grips brighten to <code>--c-blue</code> on tile hover and always show on touch. A slow sway (±0.3°, 3.2s) says “movable”.');
  out += `<h3 class="mk-h3">1 · Idle (one tile hovered)</h3>`;
  out += grid(EDIT_START.map((p, i) => editCard(p, i, i === 0 ? 'is-hover' : '')).join(''), 'is-editing is-sway blocks--placed');
  out += `<h3 class="mk-h3">2 · Dragging Recent events <span>a static clone follows the pointer (rotated −1.2°, scale 1.02, <code>--block-lift</code>); the origin cell is the drop target; <code>cursor: grabbing</code> on &lt;html&gt;</span></h3>`;
  out += `<div class="mk-frame js-drag">${grid(EDIT_START.map((p, i) => editCard(p, i, p.id === 'recent-events' ? 'is-placeholder' : '')).join(''), 'is-editing blocks--placed')}</div>`;
  out += `<h3 class="mk-h3">3 · Resizing My actions 2×1 → 2×2 <span>it snaps to allowed sizes only; neighbours below are pushed down (no reordering) and slide over <code>--dur-3</code> <code>--ease-out</code></span></h3>`;
  out += `<div class="mk-row"><button type="button" class="mk-btn js-play-resize">▶ Play resize</button><span class="mk-p" style="margin:0">Toggles 2×1 ↔ 2×2 with a FLIP slide, the way <code>useFlip</code> should animate it. Below is the frame mid-resize: tiles tagged “↓ pushed” moved down one row to make room.</span></div>`;
  out += `<div class="mk-frame">${grid(resizeFrame(), 'is-editing blocks--placed js-resize')}</div>`;
  out += `</div></section>`;
  return out;
}

/* Edit-mode layout with explicit positions (what placePushDown works on). */
const EDIT_START = [
  {id: 'my-action', s: '2x1', x: 0, y: 0}, {id: 'activity', s: '2x1', x: 2, y: 0},
  {id: 'kpi-upcoming', s: '1x1', x: 0, y: 1}, {id: 'kpi-checkin', s: '1x1', x: 1, y: 1},
  {id: 'kpi-budget', s: '1x1', x: 2, y: 1}, {id: 'kpi-pending', s: '1x1', x: 3, y: 1},
  {id: 'recent-events', s: '2x2', x: 0, y: 2}, {id: 'links', s: '2x1', x: 2, y: 2}, {id: 'web-analytics', s: '1x1', x: 2, y: 3}, {id: 'kpi-reflection', s: '1x1', x: 3, y: 3},
];
const tools = (name) => `<button class="blk-remove" type="button" aria-label="Remove ${name}">${ico('close', 12, 2.5)}</button>
  <span class="rz rz-e" role="presentation"></span><span class="rz rz-s" role="presentation"></span>
  <span class="rz rz-se" role="presentation">${ico('resize-corner', 18, 2)}</span>`;
function editCard(p, i, blkCls = '', extraHtml = '') {
  return card(p.id, p.s, {i, blkCls, place: p, extra: tools(DEF[p.id].title) + extraHtml});
}
/** Push-down: place the resized tile first, then every other tile in (y, x) order, moving it down until it fits. */
function placePushDown(items, changedId) {
  const placed = [], hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const dims = (p) => { const [w, h] = p.s.split('x').map(Number); return {...p, w, h}; };
  const order = [...items].map(dims).sort((a, b) => (a.id === changedId ? -1 : b.id === changedId ? 1 : a.y - b.y || a.x - b.x));
  for (const p of order) { const q = {...p}; while (placed.some((o) => hit(o, q))) q.y++; placed.push(q); }
  return items.map((p) => placed.find((q) => q.id === p.id));
}
function resizeFrame() {
  const after = placePushDown(EDIT_START.map((p) => p.id === 'my-action' ? {...p, s: '2x2'} : p), 'my-action');
  let html = '';
  after.forEach((p, i) => {
    const before = EDIT_START[i], moved = before.y !== p.y;
    const extra = p.id === 'my-action' ? '<span class="blk-size">2×2</span>' : moved ? `<span class="push-tag">↓ pushed</span>` : '';
    html += editCard(p, i, p.id === 'my-action' ? 'is-resizing' : moved ? 'is-pushed' : '', extra);
  });
  return html;
}

document.getElementById('themes').innerHTML = theme('light') + theme('dark');

/* Dragging frame: drop a static clone of the dragged tile over the grid, offset as if mid-drag. */
document.querySelectorAll('.js-drag').forEach((frame) => {
  const src = frame.querySelector('.blk.is-placeholder');
  const clone = src.cloneNode(true);
  clone.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));   // ids stripped, as in production
  clone.querySelectorAll('.blk-remove, .rz').forEach((n) => n.remove());
  clone.className = 'blk-float';
  const fr = frame.getBoundingClientRect(), r = src.getBoundingClientRect();
  Object.assign(clone.style, {left: (r.left - fr.left + r.width * .42) + 'px', top: (r.top - fr.top - r.height * .34) + 'px', width: r.width + 'px', height: r.height + 'px'});
  frame.appendChild(clone);
  const tag = document.createElement('span');
  tag.className = 'mk-tag'; tag.textContent = 'cursor: grabbing';
  Object.assign(tag.style, {left: (r.left - fr.left + r.width * .42 + r.width * .5) + 'px', top: (r.top - fr.top - r.height * .34 - 12) + 'px'});
  frame.appendChild(tag);
});

/* ═════════════ Resize demo: FLIP neighbours on a snapped size change ═════════════ */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flip(container, mutate) {
  const tiles = [...container.querySelectorAll('.blk')];
  const first = new Map(tiles.map((t) => { t.getAnimations().forEach((a) => a.cancel()); return [t, t.getBoundingClientRect()]; }));
  mutate();
  if (reduce) return;
  tiles.forEach((t) => {
    const a = first.get(t), b = t.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top, sx = a.width / b.width, sy = a.height / b.height;
    if (!dx && !dy && sx === 1 && sy === 1) return;
    t.animate([{transformOrigin: '0 0', transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`}, {transformOrigin: '0 0', transform: 'none'}], {duration: 240, easing: 'cubic-bezier(.2, .8, .2, 1)'});
  });
}
document.querySelectorAll('.js-play-resize').forEach((btn) => {
  const ul = btn.closest('.mk-wrap').querySelector('.js-resize');
  let big = true;
  const apply = (bigNow) => {
    const layout = bigNow ? placePushDown(EDIT_START.map((p) => p.id === 'my-action' ? {...p, s: '2x2'} : p), 'my-action') : EDIT_START.map((p) => { const [w, h] = p.s.split('x').map(Number); return {...p, w, h}; });
    ul.querySelectorAll('.blk').forEach((li) => {
      const p = layout.find((q) => q.id === li.dataset.widget);
      li.style.setProperty('--x', p.x); li.style.setProperty('--y', p.y);
      li.dataset.h = String(p.h);
      li.querySelector('.push-tag')?.remove();
      li.classList.toggle('is-pushed', false);
      const lbl = li.querySelector('.blk-size'); if (lbl) lbl.textContent = bigNow ? '2×2' : '2×1';
    });
  };
  btn.addEventListener('click', () => { big = !big; flip(ul, () => apply(big)); btn.textContent = big ? '▶ Play resize (shrink)' : '▶ Play resize (grow)'; });
});

/* ═════════════ Load motion (mockup replay; production: once per session, sessionStorage "home-entered") ═════════════ */
const fmtLike = (template, v) => {
  const m = template.match(/-?[\d,]*\.?\d+/); if (!m) return template;
  const dec = (m[0].split('.')[1] || '').length;
  const s = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: m[0].includes(',') || v >= 1e4});
  return template.replace(m[0], s);
};
function countUp(el, delay) {
  const final = el.dataset.final ?? (el.dataset.final = el.textContent);
  const m = final.match(/-?[\d,]*\.?\d+/); if (!m) return;
  const target = parseFloat(m[0].replace(/,/g, ''));
  el.textContent = fmtLike(final, 0);
  const dur = 480, t0 = performance.now() + delay;
  const step = (t) => {
    const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
    el.textContent = k >= 1 ? final : fmtLike(final, target * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function replay() {
  document.querySelectorAll('.js-entrance').forEach((ul) => {
    ul.classList.remove('is-entering'); void ul.offsetWidth; ul.classList.add('is-entering');
    if (reduce) return;
    ul.querySelectorAll('.blk').forEach((li) => {
      const i = +getComputedStyle(li).getPropertyValue('--i') || 0;
      li.querySelectorAll('[data-count]').forEach((el) => countUp(el, Math.min(i, 10) * 40 + 40));
    });
  });
}
document.getElementById('replay').addEventListener('click', replay);
replay();

/* Theme filter (mockup only) */
document.querySelectorAll('[data-show]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-show]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  document.querySelectorAll('.theme').forEach((s) => s.hidden = b.dataset.show !== 'both' && s.dataset.theme !== b.dataset.show);
}));
</script>
