<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your CSEED starts here · onboarding design</title><link rel="stylesheet" href="../../src/styles/tokens.css"><link rel="stylesheet" href="../../src/styles/base.css"><link rel="stylesheet" href="../../src/styles/components.css"><link rel="stylesheet" href="../v03.css"><style>
/* Page-specific review controls; production shell uses the shared contract. */
.onb-review{padding:10px 32px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:12px var(--font);border-top:1px solid var(--brand-line);color:var(--brand-ink-soft)}
.onb-review select{max-width:100%;background:var(--paper-raised);color:var(--brand-ink);border:1px solid var(--brand-control);padding:7px;border-radius:4px}
.onb-review a{color:inherit}.onb{grid-template-rows:auto minmax(0,1fr) auto auto}.onb-step{padding:20px 0}.onb-form .grid-fields{gap:16px}.onb-form details{border-top:1px solid var(--brand-control);padding-top:12px}.onb-form summary{cursor:pointer;min-height:44px}.onb-form .choice{background:var(--paper-raised);color:var(--brand-ink);border-color:var(--brand-control);min-height:64px}.onb-form .choice-sub{color:var(--brand-ink-soft)}.onb-form .choice-row{display:grid;grid-template-columns:1fr 1fr}.onb-form .btn{min-height:44px}.onb-form .field-error{margin:0}.onb-prefill{display:grid;grid-template-columns:100px minmax(0,1fr)}.onb-prefill dd{overflow-wrap:anywhere}.onb-art .polaroid:first-child{width:300px;height:340px;left:15px;top:30px}.onb-art .polaroid:last-child{width:270px;height:290px;right:0;bottom:20px}.onb .notice{font-family:var(--font)}
@media(max-width:767px){.onb-review{padding:8px 16px;gap:6px}.onb-review label{display:flex;align-items:center;gap:4px}.onb-review select{padding:4px;min-height:32px}.onb-form .choice-row{grid-template-columns:1fr}.onb-title.display--xl{font-size:36px}.onb-step{gap:16px}.onb-form .grid-fields{grid-template-columns:1fr}}
</style></head><body><a class="skip-link" href="#step-title">Skip to setup</a><div class="onb"><header class="onb-top"><span class="wordmark">CSEED</span><ol class="onb-progress" aria-label="Setup progress"></ol><span class="onb-count" aria-hidden="true"></span></header><main class="onb-main"><section class="onb-step"></section><aside class="onb-art is-entering" aria-label="Life at CSEED"><figure class="polaroid" style="--tilt:-6deg"><img src="../img/community-tall.webp" alt="CSEED members spending time together"><figcaption>good people. big ideas.</figcaption></figure><figure class="polaroid" style="--tilt:7deg;--n:1"><img src="../img/buildher-wide.webp" alt="The buildher community at CSEED"><figcaption>make something that matters.</figcaption></figure></aside></main><footer class="onb-foot"><button class="btn btn--text" id="back">← Back</button><span class="onb-skip">Your place in the team starts here.</span><button class="btn btn--primary" id="next">Let’s begin →</button></footer><nav class="onb-review" aria-label="Design preview controls"><span>Design preview</span><label>Step <select id="step-select"></select></label><label>State <select id="state-select"><option value="ready">Ready</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option><option value="expired">Invalid invite</option></select></label><label>Role <select id="role-select"><option>officer</option><option>director</option><option>leadership</option><option>owner</option></select></label><a href="../onboarding-notes.md">Interaction notes</a><span id="preview-status" role="status"></span></nav></div>
<script>
const q=new URLSearchParams(location.search);document.documentElement.dataset.theme=q.get('theme')||'light';
const names=['Hello','Confirm','Profile','Calendar','Widgets','Done'];let step=+(q.get('step')||1),state=q.get('state')||'ready',role=q.get('role')||'officer';
const values={phone:'+1 206 555 0142',birthday:'2005-04-18'},emails=['maya@uw.edu'],picked=new Set(['Web Analytics','Next event','My requests']);let delivery='ics',selectedEmail=0,googleConnected=false;
const $=s=>document.querySelector(s),panel=$('.onb-step');
$('#step-select').innerHTML=names.map((n,i)=>`<option value="${i+1}">${i+1} · ${n}</option>`).join('');
function field(id,label,type='text',required=false,hint=''){return `<div class="field"><label class="field-label" for="${id}">${label}${required?' · required':''}</label><input class="input" id="${id}" name="${id}" type="${type}" ${required?'required':''} value="" ${hint?`aria-describedby="${id}-hint"`:''}>${hint?`<p class="field-hint" id="${id}-hint">${hint}</p>`:''}</div>`}
function render(focus=false){
 step=Math.min(6,Math.max(1,step));$('#step-select').value=step;$('#state-select').value=state;$('#role-select').value=role;
 $('.onb-progress').setAttribute('aria-label',`Setup progress, step ${step} of 6`);$('.onb-progress').innerHTML=names.map((n,i)=>`<li class="onb-seg ${i+1<step?'is-done':''}" ${i+1===step?'aria-current="step"':''}><span class="visually-hidden">${n}</span></li>`).join('');$('.onb-count').textContent=`0${step} / 06`;
 const titles=['hey maya,<br>welcome <span class="mark">in.</span>','a familiar face.','a little about you.','make room for CSEED.','your home, your way.','you’re part of it.'];
 const ledes=['A community of people who make things happen. Now, with you in it. Let’s get your officer space ready.','Alex Chen invited you to Community. Check that we’ve got the right person before we get started.','A few essentials to help your team stay in touch. The rest is up to you.','Keep club events alongside everything else in your life. You can change this in Settings.','Start with what’s useful. Add, remove and resize widgets on Home whenever you like.','Your profile, calendar preferences and Home layout are ready. Let’s make something happen.'];
 let body='';
 if(step===1)body='<ul class="onb-checks"><li>About 4 minutes to make this space yours</li><li>One team. Plenty of room to grow.</li></ul><p class="brand-eyebrow">invited by alex chen · fall 2026</p>';
 if(step===2)body=`<dl class="onb-prefill"><dt>Name</dt><dd>Maya Patel</dd><dt>Discord</dt><dd>maya.p · <span class="mono">482916730251084812</span></dd><dt>Subteam</dt><dd>Community</dd><dt>Access</dt><dd><span class="role-badge" data-role="${role==='owner'?'leadership':role}">${role==='owner'?'Leadership · Owner':role[0].toUpperCase()+role.slice(1)}</span></dd></dl><p class="field-hint">Pre-filled by leadership. Something off? <a href="mailto:alex@example.org">Tell Alex Chen</a> before continuing. You’re signed in as maya.p.</p><p class="field-hint">${role==='officer'?'Officers work on events, contacts and design requests.':role==='director'?'Directors can also invite officers and update member records.':role==='leadership'?'Leadership manages all access, including leadership grants.':'Owners also manage co-owners and ownership transfers. At least one owner must remain.'} Access is assigned by leadership, never chosen here.</p>`;
 if(step===3)body=`<form class="onb-form" id="profile" novalidate><div class="grid-fields">${field('phone','Phone','tel',true,'Visible to directors and leadership only (including owners).')}${field('birthday','Birthday','date',true,'Use your full date of birth.')}</div><details><summary>More about you · optional</summary><div class="grid-fields">${field('preferred','Preferred name')}${field('pronouns','Pronouns')}${field('personal','Personal email','email')}${field('school','School email','email')}${field('grad','Graduation date','month')}${field('title','Title')}${field('term','Start term')}${field('linkedin','LinkedIn','url')}</div></details><p class="field-hint">Name, Discord and subteam come from your invitation.</p><p class="field-error" id="profile-error" role="alert"></p></form>`;
 if(step===4)body=`<div class="onb-form"><div class="field"><label class="field-label" for="saved-email">Calendar email</label><select class="select" id="saved-email"><option value="">${emails.length?'Choose a saved email':'No saved emails yet'}</option>${emails.map((e,i)=>`<option value="${i}">${e}</option>`).join('')}<option value="add" ${emails.length===5?'disabled':''}>Add another…</option></select><p class="field-hint">${emails.length} of 5 saved. ${emails.length===5?'Remove one in Settings to add another.':'Add up to five addresses.'}</p></div><form id="email-add" ${emails.length?'hidden':''}>${field('new-email','Add a calendar email','email')}<button class="btn" type="submit" ${emails.length===5?'disabled':''}>Save email</button><p id="email-error" class="field-error" role="alert"></p></form><fieldset class="fieldset"><legend>How should events reach you?</legend><div class="choice-row"><label class="choice"><input type="radio" name="delivery" value="ics" ${delivery==='ics'?'checked':''}><span class="choice-title">.ics email invites</span><span class="choice-sub">Open invites in your calendar app.</span></label><label class="choice"><input type="radio" name="delivery" value="google" ${delivery==='google'?'checked':''}><span class="choice-title">Google Calendar sync</span><span class="choice-sub">Connect your Google account.</span></label></div></fieldset><div id="google" ${delivery==='google'?'':'hidden'}><button class="btn" id="connect">Connect Google Calendar</button><p class="field-hint" id="oauth" role="status">Consent opens on Google. Cancel returns here; saved emails stay intact.</p></div><p class="field-hint">Calendar setup is optional. Continue without connecting to finish it later in Settings.</p></div>`;
 if(step===5)body=`<div class="onb-form"><div class="choice-row">${['Web Analytics','Next event','My requests','Member signups','Traffic & security','Performance','Workers / D1 usage'].map(n=>`<label class="choice"><input type="checkbox" value="${n}" ${picked.has(n)?'checked':''}><span class="choice-title">${n}</span><span class="choice-sub">${n==='Web Analytics'?'On by default · Not connected':n==='My requests'?'Purchase and design work':n==='Next event'?'What’s coming up':'Not connected · available when configured'}</span></label>`).join('')}</div><p class="field-hint" id="widget-count">${picked.size} widgets selected. Your layout follows you across devices.</p></div>`;
 if(step===6)body=`<ul class="onb-checks"><li>✓ Maya Patel · Community</li><li>✓ Profile complete</li><li>✓ ${emails.length} calendar email${emails.length===1?'':'s'} saved</li><li>${emails.length?(delivery==='google'?(googleConnected?'✓ Google Calendar connected':'Calendar setup deferred · Google not connected'):'✓ .ics invites selected'):'Calendar setup deferred · no invites will be sent'}</li><li>✓ ${picked.size} Home widgets selected</li></ul><p class="field-hint">Cloudflare widgets will say “Not connected” until credentials are configured.</p>`;
 panel.innerHTML=`<p class="brand-eyebrow">${step===1?'your cseed starts here':names[step-1].toLowerCase()+' · fall 2026'}</p><h1 class="display display--xl onb-title" id="step-title" tabindex="-1">${titles[step-1]}</h1><p class="brand-lede onb-lede">${ledes[step-1]}</p>${body}`;
 if(state==='empty'&&step===5){picked.clear();panel.innerHTML+='<div class="notice">No widgets selected. Start with a quiet Home and add widgets later.</div>';panel.querySelectorAll('[type=checkbox]').forEach(e=>e.checked=false)}
 else if(state==='empty'&&step!==4)panel.innerHTML+='<div class="state state--empty"><p class="state-title">Nothing saved yet</p><p class="state-body">Your invitation is ready. Complete your profile to get started.</p></div>';
 if(state==='loading')panel.innerHTML='<div class="state state--loading" aria-busy="true"><p class="brand-eyebrow">one moment</p><h1 class="display display--l onb-title" id="step-title" tabindex="-1">Getting your space ready.</h1><p role="status">Loading your invitation and saved setup…</p><div class="skel skel--row" aria-hidden="true"></div></div>';
 if(state==='error')panel.innerHTML+='<div class="notice notice--negative" role="alert">We couldn’t save this step. Your entries are still here. Check your connection, then try again. <button class="btn" id="retry">Try again</button></div>';
 if(state==='expired')panel.innerHTML='<p class="brand-eyebrow">invitation unavailable</p><h1 class="display display--l onb-title" id="step-title" tabindex="-1">Let’s get you a fresh start.</h1><p class="brand-lede">This invitation has expired or isn’t valid. Ask the director who invited you for a new link.</p><p>Signed in as maya.p? Invitations only work with the matching Discord account.</p><a class="btn" href="/login">Return to sign in</a><p class="field-hint">No profile information has been submitted.</p>';
 $('#back').disabled=step===1||state==='loading'||state==='expired';$('#next').disabled=state==='loading'||state==='expired'||state==='error';$('#next').textContent=step===1?'Let’s begin →':step===6?'Go to dashboard →':'Continue →';
 panel.querySelectorAll('input:not([type=radio]):not([type=checkbox])').forEach(e=>{e.value=state==='empty'?'':values[e.id]||'';e.oninput=()=>values[e.id]=e.value});
 if($('#retry'))$('#retry').onclick=()=>{state='ready';render()};
 if($('#saved-email')){$('#saved-email').value=emails.length?selectedEmail:'';$('#saved-email').onchange=e=>{if(e.target.value!=='add')selectedEmail=e.target.value;if(e.target.value==='add'){$('#email-add').hidden=false;$('#new-email').focus()}};$('#email-add').onsubmit=e=>{e.preventDefault();const input=$('#new-email'),v=input.value.trim();if(!v||!input.checkValidity()||emails.includes(v)||emails.length>=5){input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','email-error');$('#email-error').textContent='Enter a new, valid email. You can save up to five.';return}emails.push(v);selectedEmail=emails.length-1;render()};panel.querySelectorAll('[name=delivery]').forEach(e=>e.onchange=()=>{delivery=e.value;render()});if($('#connect'))$('#connect').onclick=()=>{$('#oauth').textContent='Preview: Google consent cancelled. Try again, choose .ics invites, or Continue to set up later.'}}
 panel.querySelectorAll('[type=checkbox]').forEach(e=>e.onchange=()=>{e.checked?picked.add(e.value):picked.delete(e.value);$('#widget-count').textContent=`${picked.size} widgets selected. You can change this on Home.`});
 panel.classList.remove('is-entering');void panel.offsetWidth;panel.classList.add('is-entering');$('.onb-main').scrollTop=0;if(focus)$('#step-title').focus();
}
function move(n){if(n>step&&step===3){let invalid=[];for(const id of ['phone','birthday']){const e=$('#'+id);if(!e.value||(id==='phone'&&e.value.replace(/\D/g,'').length<7)||(id==='birthday'&&e.value>new Date().toISOString().slice(0,10))){e.setAttribute('aria-invalid','true');e.setAttribute('aria-describedby',id+'-hint profile-error');invalid.push(e)}else e.removeAttribute('aria-invalid')}for(const e of panel.querySelectorAll('input[type=email],input[type=url]'))if(e.value&&!e.checkValidity()){e.reportValidity();return}if(invalid.length){$('#profile-error').textContent='Enter a valid phone number and a birthday that is not in the future.';invalid[0].focus();return}}$('.onb').dataset.dir=n<step?'back':'forward';step=n;state='ready';render(true)}
$('#next').onclick=()=>{if(step===6){$('#preview-status').textContent='Preview complete · dashboard handoff';location.href='home.html'}else if(step===4&&delivery==='google'&&!googleConnected){$('#oauth').innerHTML='Google is not connected. <button class="btn" id="defer">Set up later</button>';$('#defer').onclick=()=>move(5);$('#defer').focus()}else move(step+1)};$('#back').onclick=()=>move(step-1);$('#step-select').onchange=e=>{step=+e.target.value;render(true)};$('#state-select').onchange=e=>{state=e.target.value;if(state==='empty'&&step===4)emails.length=0;render(true)};$('#role-select').onchange=e=>{role=e.target.value;render(true)};window.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowLeft'&&step>1&&!$('#back').disabled){e.preventDefault();move(step-1)}});render();
</script></body></html>
